name: Build Injected V2Ray
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget openjdk-17-jdk zipalign apksigner
        wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
        chmod +x apktool
        wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
    - name: Run Injection Script
      run: |
        export PATH=$PATH:.
        chmod +x build_injected.sh
        ./build_injected.sh
